# WSO2 integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in wso2-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: wso2-github
  label: Sync WSO2 Publisher APIs from a GitHub OpenAPI repo
  partner: github
  category: DevOps
  use_case: On push to main, read the OpenAPI document from a GitHub repo and update the matching WSO2 API Manager
    Publisher API + create a new revision so source-of-truth lives with the code.
  evidence: https://github.com/marketplace/choreo-apps
  type: marketplace
  source: curated
  status: not-a-workflow
  arazzo: null
- slug: wso2-gitlab
  label: Sync WSO2 Publisher APIs from a GitLab OpenAPI repo
  partner: gitlab
  category: DevOps
  use_case: On GitLab push, fetch the latest OpenAPI file and re-deploy the matching WSO2 Publisher API + revision
    so the GitLab repo is the source-of-truth.
  source: curated
  status: pending-generation
  arazzo: null
