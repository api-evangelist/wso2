naftiko: 1.0.0-alpha2
info:
  label: Alert Slack channels on WSO2 API lifecycle changes
  description: Forward WSO2 API Manager lifecycle changes (PUBLISHED, DEPRECATED, RETIRED) and policy violations to a designated Slack channel via Incoming Webhook.
  tags:
  - WSO2
  - Integration
  - Notifications
  - slack
  created: '2026-05-20'
  modified: '2026-05-20'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
    SLACK_API_KEY: SLACK_API_KEY
capability:
  consumes:
  - type: http
    namespace: wso2
    baseUri: https://api.wso2.com
    description: WSO2 API operations consumed by this integration.
    resources:
    - name: apis-apiid-lifecycle-history
      path: /apis/{apiId}/lifecycle-history
      operations:
      - name: getlifecyclehistory
        method: GET
        description: Read the lifecycle history of a Publisher API.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: apiId
          in: path
          type: string
          description: Path parameter apiId.
          required: true
    - name: apis-change-lifecycle
      path: /apis/change-lifecycle
      operations:
      - name: changelifecycle
        method: POST
        description: Trigger a lifecycle change for an API, then notify Slack.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  - type: http
    namespace: slack
    baseUri: https://hooks.slack.com
    description: Slack Incoming Webhooks operations consumed by this integration.
    resources:
    - name: services-t-b-x
      path: /services/{T}/{B}/{X}
      operations:
      - name: postmessage
        method: POST
        description: 'Slack Incoming Webhooks: postMessage'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: T
          in: path
          type: string
          description: Path parameter T.
          required: true
        - name: B
          in: path
          type: string
          description: Path parameter B.
          required: true
        - name: X
          in: path
          type: string
          description: Path parameter X.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: mcp
    namespace: wso2-slack-mcp
    description: MCP adapter for the wso2-slack integration.
    tools:
    - name: wso2_slack
      description: Execute the wso2 slack integration end-to-end.
      inputSchema:
        type: object
        properties:
          trigger_event:
            type: object
            description: Triggering event payload.
        required:
        - trigger_event
  - type: rest
    namespace: wso2-slack-rest
    port: 8080
    description: REST adapter for the wso2-slack integration.
    resources:
    - path: /wso2-slack
      name: wso2-slack
      description: REST surface for the wso2-slack integration.
      operations:
      - method: POST
        name: trigger
        description: Trigger the wso2-slack integration.
        call: wso2_slack
        with:
          trigger_event: rest.body
        outputParameters:
        - type: object
          mapping: $.
