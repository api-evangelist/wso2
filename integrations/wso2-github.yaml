naftiko: 1.0.0-alpha2
info:
  label: Sync WSO2 Publisher APIs from a GitHub OpenAPI repo
  description: On push to main, read the OpenAPI document from a GitHub repo and update the matching WSO2 API Manager Publisher API + create a new revision so source-of-truth lives with the code.
  tags:
  - WSO2
  - Integration
  - DevOps
  - github
  created: '2026-05-20'
  modified: '2026-05-20'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
    GITHUB_API_KEY: GITHUB_API_KEY
capability:
  consumes:
  - type: http
    namespace: wso2
    baseUri: https://api.wso2.com
    description: WSO2 API operations consumed by this integration.
    resources:
    - name: apis-apiid
      path: /apis/{apiId}
      operations:
      - name: updatepublisherapi
        method: PUT
        description: Update an existing Publisher API definition from the GitHub spec.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: apiId
          in: path
          type: string
          description: Path parameter apiId.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: apis-apiid-revisions
      path: /apis/{apiId}/revisions
      operations:
      - name: createapirevision
        method: POST
        description: Create a new revision of the Publisher API after the spec sync.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: apiId
          in: path
          type: string
          description: Path parameter apiId.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  - type: http
    namespace: github
    baseUri: https://api.github.com
    description: GitHub REST API operations consumed by this integration.
    resources:
    - name: repos-owner-repo-contents-path
      path: /repos/{owner}/{repo}/contents/{path}
      operations:
      - name: getrepocontent
        method: GET
        description: 'GitHub REST API: getRepoContent'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          description: Path parameter owner.
          required: true
        - name: repo
          in: path
          type: string
          description: Path parameter repo.
          required: true
        - name: path
          in: path
          type: string
          description: Path parameter path.
          required: true
    - name: repos-owner-repo-commits-ref
      path: /repos/{owner}/{repo}/commits/{ref}
      operations:
      - name: getcommit
        method: GET
        description: 'GitHub REST API: getCommit'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          description: Path parameter owner.
          required: true
        - name: repo
          in: path
          type: string
          description: Path parameter repo.
          required: true
        - name: ref
          in: path
          type: string
          description: Path parameter ref.
          required: true
  exposes:
  - type: mcp
    namespace: wso2-github-mcp
    description: MCP adapter for the wso2-github integration.
    tools:
    - name: wso2_github
      description: Execute the wso2 github integration end-to-end.
      inputSchema:
        type: object
        properties:
          trigger_event:
            type: object
            description: Triggering event payload.
        required:
        - trigger_event
  - type: rest
    namespace: wso2-github-rest
    port: 8080
    description: REST adapter for the wso2-github integration.
    resources:
    - path: /wso2-github
      name: wso2-github
      description: REST surface for the wso2-github integration.
      operations:
      - method: POST
        name: trigger
        description: Trigger the wso2-github integration.
        call: wso2_github
        with:
          trigger_event: rest.body
        outputParameters:
        - type: object
          mapping: $.
