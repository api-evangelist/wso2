  /apis/{apiId}/generate-definition-url:
    post:
      tags:
      - APIs
      summary: Generate a URL to download a resource for an API
      description: Generate a URL to access an API resource like the WSDL definition.
      operationId: generateDefinitionURL
      parameters:
      - $ref: '#/components/parameters/resourceType'
      - $ref: '#/components/parameters/environmentName'
      - $ref: '#/components/parameters/apiId'
      - $ref: '#/components/parameters/requestedTenant'
      responses:
        '200':
          description: OK. Returns generated download URL as a string.
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - OAuth2Security: []
    servers:
    - url: https://apis.wso2.com/api/am/devportal/v3
components:
  schemas:
    ApiResult:
      type: object
      properties:
        provider:
          type: string
        name:
          type: string
        version:
          type: string
        id:
          type: string
    Pagination:
      title: Pagination
      type: object
      properties:
        offset:
          type: integer
          example: 0
        limit:
          type: integer
          example: 1
        total:
          type: integer
          example: 10
        next:
          type: string
          description: 'Link to the next subset of resources qualified.

            Empty if no more resources are to be returned.

            example: ""

            '
        previous:
          type: string
          description: 'Link to the previous subset of resources qualified.

            Empty if current subset is the first subset returned.

            example: ""

            '
    SearchResultList:
      title: Unified Search Result List
      type: object
      properties:
        apis:
          type: array
          items:
            $ref: '#/components/schemas/ApiResult'
        count:
          type: integer
          description: 'Number of results returned.

            '
          example: 1
        pagination:
          $ref: '#/components/schemas/Pagination'
    Error:
      title: Error object returned with 4XX HTTP status
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: integer
          description: Error code
          format: int64
        message:
          type: string
          description: Error message.
        description:
          type: string
          description: 'A detail description about the error message.

            '
        moreInfo:
          type: string
          description: 'Preferably an url with more details about the error.

            '
        error:
          type: array
          description: 'If there are more than one error list them out.

            For example, list out validation errors by each field.

            '
          items:
            $ref: '#/components/schemas/ErrorListItem'
    ErrorListItem:
      title: Description of individual errors that may have occurred during a request.
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: 'Description about individual errors occurred

            '
    AdvertiseInfo:
