    servers:
    - url: https://apis.wso2.com/api/am/devportal/v3
  /applications/{applicationId}/api-keys/{keyType}/subscriptions:
    get:
      tags:
      - API Keys
      summary: Get Subscribed APIs with API Key(s) of a Given Type
      description: Retrieve subscribed APIs with non-associated API Key(s) for the application specifying the key type in the URI.
      operationId: getSubscribedAPIsWithAPIKeys
      parameters:
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/keyType'
      - $ref: '#/components/parameters/If-None-Match'
