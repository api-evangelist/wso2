    servers:
    - url: https://apis.wso2.com/api/am/devportal/v3
  /applications/{applicationId}/api-keys/{keyType}/revoke:
    post:
      tags:
      - API Keys
      summary: Revoke API Key
      description: Revoke a self contained API Key for the application
      operationId: applicationsApplicationIdApiKeysKeyTypeRevokePost
      parameters:
