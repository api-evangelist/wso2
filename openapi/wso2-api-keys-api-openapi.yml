    servers:
    - url: https://apis.wso2.com/api/am/devportal/v3
  /applications/{applicationId}/api-keys/{keyType}/regenerate:
    post:
      tags:
      - API Keys
      summary: Regenerate API Key
      description: Regenerate a self contained API Key for the application specified by the key UUID
      operationId: regenerateAppBoundAPIKey
      parameters:
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/keyType'
