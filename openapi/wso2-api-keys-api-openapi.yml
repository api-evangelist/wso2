    servers:
    - url: https://apis.wso2.com/api/am/devportal/v3
  /applications/{applicationId}/api-keys/{keyType}:
    get:
      tags:
      - API Keys
      summary: Get API Key(s) of a Given Type
      description: Retrieve self contained API Key(s) for the application specifying the key type in the URI.
      operationId: getAppBoundAPIKeys
      parameters:
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/keyType'
      - $ref: '#/components/parameters/If-None-Match'
      responses:
        200:
          description: 'OK.

            API key(s) of given type are returned.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyList_2'
        400:
