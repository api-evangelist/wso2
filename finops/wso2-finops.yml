description: 'FOCUS-aligned FinOps for WSO2: open-source product (no software cost) plus two SaaS
  cost surfaces - Choreo, billed per-component-month with infrastructure resource credits, and
  Asgardeo, billed per monthly-active-user across B2C / B2B / B2E. Enterprise on-prem support
  contracts are quote-based.'
