principles:
  - name: Visibility
    description: Choreo exposes per-organization resource-credit and component-usage dashboards;
      Asgardeo exposes MAU dashboards per flavor (B2C / B2B / B2E). On-prem WSO2 has no vendor
      bill - operators meter their own infrastructure costs.
  - name: Allocation
    description: Allocate Choreo by component and organization; allocate Asgardeo by tenant /
      sub-organization and MAU flavor. On-prem allocates by deployment environment and
      subscription contract.
  - name: Optimization
    description: For Choreo, levers are right-sizing component count, scaling-to-zero unused
      services, and managing build/deployment frequency. For Asgardeo, MAU pruning and selecting
      the appropriate flavor (B2C vs B2B vs B2E) are the main levers. For on-prem, throttling-
      tier policy tuning is the operator's lever.
  - name: Accountability
    description: Choreo cost owned by the engineering team running components; Asgardeo cost
      owned by the IAM team or product team owning the customer-facing app; on-prem subscription
      cost owned by the platform team renewing the WSO2 contract.
