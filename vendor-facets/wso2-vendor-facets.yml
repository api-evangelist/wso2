# Vendor facets — WSO2 API Manager (and the WSO2 API Platform gateway). A publisher/developer-portal/
# gateway stack with subscription rate-limiting tiers chosen in the Developer Portal, an MCP gateway that
# generates MCP servers from existing APIs or OpenAPI, an MCP Hub in the portal, and an MCP
# Authentication policy that publishes OAuth protected-resource metadata. The trap: the shipped default
# tiers (Bronze 1000/min, Silver 2000/min, Gold 5000/min, Unlimited) read like published limits whether or
# not they are the provider's real ones. What it cannot reach: rate-limit headers, pricing, SDKs.
vendor: wso2
name: WSO2 API Manager
website: https://wso2.com/api-manager/
areas:
- api-gateway
registry_keys:
- wso2
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  WSO2 earns the portal set once declared — catalog, OpenAPI-generated docs, try-it, self-service subscriptions
  with keys and OAuth tokens — and on agent readiness it generates MCP servers from the provider's own
  APIs on the provider's gateway (`templated`, 0.6) with an MCP auth policy that publishes protected-resource
  metadata naming the configured issuers. Subscription tiers are visible to signed-in consumers, and the
  out-of-the-box Bronze/Silver/Gold values are placeholders a provider should replace before anyone harvests
  them as its limits. Nothing fetched shows WSO2 emitting rate-limit headers.
features:
- id: subscription-tiers
  name: Subscription-level rate-limiting tiers
  description: >-
    Tiers chosen by consumers at subscription time in the Developer Portal; defaults are Bronze 1000 req/min,
    Silver 2000, Gold 5000 and Unlimited; application- and resource-level tiers also exist.
  source: https://apim.docs.wso2.com/en/4.4.0/design/rate-limiting/setting-throttling-limits/
  tier: open-source
- id: mcp-gateway
  name: MCP gateway — MCP servers from OpenAPI or existing APIs
  description: >-
    Creates MCP servers by importing an OpenAPI definition, converting an existing APIM API's operations
    to tools, or proxying an external MCP server, with auth and rate-limit policies attached.
  source: https://apim.docs.wso2.com/en/latest/ai-gateway/mcp-gateway/overview/
  tier: open-source
- id: mcp-auth-policy
  name: MCP Authentication policy with protected resource metadata
  description: >-
    Gateway policy that validates JWTs from configured key managers and publishes the named issuers (and
    advertised requiredScopes) in protected resource metadata, on the MCP API's own vhost.
  source: https://wso2.com/api-platform/docs/cloud/ai-gateway/mcp/policies/mcp-authentication/
  tier: unknown
- id: developer-portal
  name: Developer Portal and MCP Hub
  description: >-
    API catalog with interactive docs generated from OpenAPI/AsyncAPI, live try-it console, self-service
    subscriptions issuing OAuth2 tokens and API keys, usage dashboards, and an MCP Hub catalog of MCP
    servers and tools.
  source: https://wso2.com/api-platform/api-developer-portal/
  tier: open-source
maps:
- feature: developer-portal
  check: portal_present
  layer: composite
  provider_must: Declare the Developer Portal URL as a DeveloperPortal entry in apis.yml common[].
  catalog_pass_rate: 0.228
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.633
- feature: developer-portal
  check: api_reference_present
  layer: composite
  provider_must: Declare the generated API documentation as an APIReference entry in apis.yml common[].
  catalog_pass_rate: 0.222
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.942
  saturated: true
  saturated_note: >-
    94% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: developer-portal
  check: console_or_sandbox
  layer: composite
  provider_must: Declare the try-it console as a Console entry in apis.yml common[].
  catalog_pass_rate: 0.089
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.332
- feature: developer-portal
  check: sign_up_present
  layer: composite
  provider_must: >-
    Leave self sign-up enabled and declare the sign-up/login page as SignUp or Login in apis.yml common[].
  catalog_pass_rate: 0.19
  facet: access_clarity
  points: 5
  baseline_pass_rate: 0.463
- feature: subscription-tiers
  check: rate_limits_documented
  layer: composite
  conditional: true
  condition: >-
    Only if the provider publishes its real tier limits on a public page — tiers are shown to signed-in
    consumers at subscription time, and the default Bronze/Silver/Gold numbers are WSO2's, not the provider's.
  catalog_pass_rate: 0.145
  facet: operational_transparency
  points: 8
  baseline_pass_rate: 0.438
- feature: subscription-tiers
  check: rate_limit_signal
  layer: agent_readiness
  grade: documented
  partial: true
  partial_note: >-
    Only the `documented` fallback (a published rate_limits artifact) is in reach; nothing fetched shows
    the gateway emitting X-RateLimit-*/RateLimit/Retry-After headers or writing them into the provider's
    OpenAPI, which is what `verified` reads.
  points: 7
  baseline_pass_rate: 0.381
- feature: mcp-gateway
  check: mcp_server
  layer: agent_readiness
  grade: templated
  note: >-
    Generated from the provider's own OpenAPI or APIs and served on the provider's gateway — `templated`
    (0.6); `verified` only when the catalog probe of the provider's mcp/ manifest passes.
  points: 12
  baseline_pass_rate: 0.22
- feature: mcp-auth-policy
  check: protected_resource_metadata
  layer: agent_readiness
  grade: verified
  provider_must: >-
    Attach the MCP Authentication policy with the issuer(s) configured, on the host the catalog probes;
    the metadata then names its authorization servers. Covers the MCP API, not the provider's REST APIs.
  points: 5
  baseline_pass_rate: 0.133
- feature: mcp-auth-policy
  check: well_known_published
  layer: composite
  conditional: true
  condition: >-
    Only if the protected-resource document is served under /.well-known/ on the provider's own probed
    host; the fetched policy page describes publishing the metadata but not its path.
  catalog_pass_rate: 0.005
  facet: discoverability
  points: 6
  baseline_pass_rate: 0.018
earns_nothing:
- feature: subscription-tiers
  check: plans_present
  why: >-
    Tiers are throttling policies, not a public plan catalog; the plans artifact is harvested from public
    pricing pages, and the fetched page shows tiers selected after sign-in.
- feature: developer-portal
  check: mcp_server
  why: >-
    The MCP Hub catalogs MCP servers for agent developers; the rubric grades the provider's own MCP server,
    not a portal listing of it.
out_of_reach:
  checks:
  - sdk_count_1
  - sdk_count_3
  - cli_present
  - idempotency
  - dry_run_mode
  - reversibility_documented
  - pricing_link
  - llms_txt_published
  - agent_card
  - error_semantics
  - dynamic_client_registration
  note: >-
    Pricing, SDKs, llms.txt and API behaviours are the provider's to publish, and nothing fetched shows
    WSO2's key manager discovery being served where the catalog probes.
unscored_practice:
- feature: subscription-tiers
  why: >-
    Shipped default tier values (1000/2000/5000 per minute) can surface on portals unchanged; a harvest
    that treats them as the provider's limits would credit a template. The rubric has no test for vendor-default
    limits.
