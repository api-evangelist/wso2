      - name: Unrestricted suborganization levels
  - id: wso2-asgardeo-b2b-free
    name: Asgardeo B2B Free
    type: freemium
    description: Free Asgardeo B2B identity tier - up to 250 B2B monthly active users and 3
      sub-organizations with basic authentication features.
    entries:
      - label: Monthly active users
        name: mau
        type: quota
        metric: mau
