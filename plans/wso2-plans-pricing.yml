        price: $160 per 1,000 MAUs/month
        userMultiplied: false
    elements:
      - name: Customizable branding
      - name: Enterprise logins
      - name: Unlimited / adaptive MFA
      - name: Remote user store connections
  - id: wso2-asgardeo-b2c-enterprise
    name: Asgardeo B2C Enterprise
    type: enterprise
