      - name: Full feature set
      - name: SLA protections
  - id: wso2-asgardeo-b2e-free
    name: Asgardeo B2E Free
    type: freemium
    description: Free Asgardeo Workforce (B2E) tier - up to 50 employee monthly active users.
    entries:
      - label: Monthly active users
        name: mau
        type: quota
        metric: mau
        limit: 50
