naftiko: 1.0.0-alpha2
info:
  label: WSO2 API Manager - Admin — Alert Subscriptions
  description: 'WSO2 API Manager - Admin — Alert Subscriptions. 3 operations. Lead operation: Get Subscribed Alert Types.
    Self-contained Naftiko capability covering one Wso2 business surface.'
  tags:
  - Wso2
  - Alert Subscriptions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-alert-subscriptions
    baseUri: https://apis.wso2.com/api/am/admin/v4
    description: WSO2 API Manager - Admin — Alert Subscriptions business capability. Self-contained, no shared references.
    resources:
    - name: alert-subscriptions
      path: /alert-subscriptions
      operations:
      - name: getsubscribedalerttypes
        method: GET
        description: Get Subscribed Alert Types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: subscribetoalerts
        method: PUT
        description: Subscribe to an Admin Alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: unsubscribeallalerts
        method: DELETE
        description: Unsubscribe User from all Admin Alerts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.WSO2_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-alert-subscriptions-rest
    port: 8080
    description: REST adapter for WSO2 API Manager - Admin — Alert Subscriptions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/alert-subscriptions
      name: alert-subscriptions
      description: REST surface for alert-subscriptions.
      operations:
      - method: GET
        name: getsubscribedalerttypes
        description: Get Subscribed Alert Types
        call: admin-alert-subscriptions.getsubscribedalerttypes
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: subscribetoalerts
        description: Subscribe to an Admin Alert
        call: admin-alert-subscriptions.subscribetoalerts
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: unsubscribeallalerts
        description: Unsubscribe User from all Admin Alerts
        call: admin-alert-subscriptions.unsubscribeallalerts
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-alert-subscriptions-mcp
    port: 9090
    transport: http
    description: MCP adapter for WSO2 API Manager - Admin — Alert Subscriptions. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-subscribed-alert-types
      description: Get Subscribed Alert Types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-alert-subscriptions.getsubscribedalerttypes
      outputParameters:
      - type: object
        mapping: $.
    - name: subscribe-admin-alert
      description: Subscribe to an Admin Alert
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: admin-alert-subscriptions.subscribetoalerts
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: unsubscribe-user-all-admin-alerts
      description: Unsubscribe User from all Admin Alerts
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: admin-alert-subscriptions.unsubscribeallalerts
      outputParameters:
      - type: object
        mapping: $.
