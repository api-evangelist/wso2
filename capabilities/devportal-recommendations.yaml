naftiko: 1.0.0-alpha2
info:
  label: WSO2 API Manager - Developer Portal — Recommendations
  description: 'WSO2 API Manager - Developer Portal — Recommendations. 1 operations. Lead operation: Give API Recommendations
    for a User. Self-contained Naftiko capability covering one Wso2 business surface.'
  tags:
  - Wso2
  - Recommendations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
capability:
  consumes:
  - type: http
    namespace: devportal-recommendations
    baseUri: https://apis.wso2.com/api/am/devportal/v3
    description: WSO2 API Manager - Developer Portal — Recommendations business capability. Self-contained, no shared references.
    resources:
    - name: recommendations
      path: /recommendations
      operations:
      - name: get
        method: GET
        description: Give API Recommendations for a User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.WSO2_API_KEY}}'
  exposes:
  - type: rest
    namespace: devportal-recommendations-rest
    port: 8080
    description: REST adapter for WSO2 API Manager - Developer Portal — Recommendations. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/recommendations
      name: recommendations
      description: REST surface for recommendations.
      operations:
      - method: GET
        name: get
        description: Give API Recommendations for a User
        call: devportal-recommendations.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: devportal-recommendations-mcp
    port: 9090
    transport: http
    description: MCP adapter for WSO2 API Manager - Developer Portal — Recommendations. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: give-api-recommendations-user
      description: Give API Recommendations for a User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: devportal-recommendations.get
      outputParameters:
      - type: object
        mapping: $.
