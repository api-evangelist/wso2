naftiko: 1.0.0-alpha2
info:
  label: WSO2 API Manager - Admin — Consumption
  description: 'WSO2 API Manager - Admin — Consumption. 1 operations. Lead operation: Export API Consumption Data. Self-contained
    Naftiko capability covering one Wso2 business surface.'
  tags:
  - Wso2
  - Consumption
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-consumption
    baseUri: https://apis.wso2.com/api/am/admin/v4
    description: WSO2 API Manager - Admin — Consumption business capability. Self-contained, no shared references.
    resources:
    - name: export-consumption
      path: /export-consumption
      operations:
      - name: exportconsumptiondata
        method: GET
        description: Export API Consumption Data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fromDate
          in: query
          type: string
          description: 'Start date of the export range (inclusive). Format: YYYY-MM-DD.'
          required: true
        - name: toDate
          in: query
          type: string
          description: 'End date of the export range (inclusive). Format: YYYY-MM-DD.'
          required: true
    authentication:
      type: bearer
      token: '{{env.WSO2_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-consumption-rest
    port: 8080
    description: REST adapter for WSO2 API Manager - Admin — Consumption. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/export-consumption
      name: export-consumption
      description: REST surface for export-consumption.
      operations:
      - method: GET
        name: exportconsumptiondata
        description: Export API Consumption Data
        call: admin-consumption.exportconsumptiondata
        with:
          fromDate: rest.fromDate
          toDate: rest.toDate
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-consumption-mcp
    port: 9090
    transport: http
    description: MCP adapter for WSO2 API Manager - Admin — Consumption. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: export-api-consumption-data
      description: Export API Consumption Data
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-consumption.exportconsumptiondata
      with:
        fromDate: tools.fromDate
        toDate: tools.toDate
      outputParameters:
      - type: object
        mapping: $.
