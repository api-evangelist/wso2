naftiko: 1.0.0-alpha2
info:
  label: WSO2 API Manager - Admin — Roles
  description: 'WSO2 API Manager - Admin — Roles. 1 operations. Lead operation: Check Whether Given Role Name already Exist.
    Self-contained Naftiko capability covering one Wso2 business surface.'
  tags:
  - Wso2
  - Roles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-roles
    baseUri: https://apis.wso2.com/api/am/admin/v4
    description: WSO2 API Manager - Admin — Roles business capability. Self-contained, no shared references.
    resources:
    - name: roles-roleId
      path: /roles/{roleId}
      operations:
      - name: validatesystemrole
        method: HEAD
        description: Check Whether Given Role Name already Exist
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.WSO2_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-roles-rest
    port: 8080
    description: REST adapter for WSO2 API Manager - Admin — Roles. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/roles/{roleid}
      name: roles-roleid
      description: REST surface for roles-roleId.
      operations:
      - method: HEAD
        name: validatesystemrole
        description: Check Whether Given Role Name already Exist
        call: admin-roles.validatesystemrole
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-roles-mcp
    port: 9090
    transport: http
    description: MCP adapter for WSO2 API Manager - Admin — Roles. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: check-whether-given-role-name
      description: Check Whether Given Role Name already Exist
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: admin-roles.validatesystemrole
      outputParameters:
      - type: object
        mapping: $.
