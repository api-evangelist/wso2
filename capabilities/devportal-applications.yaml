        destructive: false
        idempotent: false
      call: devportal-applications.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-details-application
      description: Get Details of an Application
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: devportal-applications.get
      outputParameters:
      - type: object
        mapping: $.
