naftiko: 1.0.0-alpha2
info:
  label: WSO2 API Manager - Admin — Users
  description: 'WSO2 API Manager - Admin — Users. 1 operations. Lead operation: Get the Organization information of the user.
    Self-contained Naftiko capability covering one Wso2 business surface.'
  tags:
  - Wso2
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-users
    baseUri: https://apis.wso2.com/api/am/admin/v4
    description: WSO2 API Manager - Admin — Users business capability. Self-contained, no shared references.
    resources:
    - name: me-organization-information
      path: /me/organization-information
      operations:
      - name: organizationinformation
        method: GET
        description: Get the Organization information of the user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.WSO2_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-users-rest
    port: 8080
    description: REST adapter for WSO2 API Manager - Admin — Users. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/me/organization-information
      name: me-organization-information
      description: REST surface for me-organization-information.
      operations:
      - method: GET
        name: organizationinformation
        description: Get the Organization information of the user
        call: admin-users.organizationinformation
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for WSO2 API Manager - Admin — Users. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-organization-information-user
      description: Get the Organization information of the user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-users.organizationinformation
      outputParameters:
      - type: object
        mapping: $.
