naftiko: 1.0.0-alpha2
info:
  label: WSO2 API Manager - Developer Portal — Tenants
  description: 'WSO2 API Manager - Developer Portal — Tenants. 1 operations. Lead operation: Get Tenants by State. Self-contained
    Naftiko capability covering one Wso2 business surface.'
  tags:
  - Wso2
  - Tenants
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
capability:
  consumes:
  - type: http
    namespace: devportal-tenants
    baseUri: https://apis.wso2.com/api/am/devportal/v3
    description: WSO2 API Manager - Developer Portal — Tenants business capability. Self-contained, no shared references.
    resources:
    - name: tenants
      path: /tenants
      operations:
      - name: get
        method: GET
        description: Get Tenants by State
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: state
          in: query
          type: string
          description: The state represents the current state of the tenant
    authentication:
      type: bearer
      token: '{{env.WSO2_API_KEY}}'
  exposes:
  - type: rest
    namespace: devportal-tenants-rest
    port: 8080
    description: REST adapter for WSO2 API Manager - Developer Portal — Tenants. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/tenants
      name: tenants
      description: REST surface for tenants.
      operations:
      - method: GET
        name: get
        description: Get Tenants by State
        call: devportal-tenants.get
        with:
          state: rest.state
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: devportal-tenants-mcp
    port: 9090
    transport: http
    description: MCP adapter for WSO2 API Manager - Developer Portal — Tenants. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-tenants-state
      description: Get Tenants by State
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: devportal-tenants.get
      with:
        state: tools.state
      outputParameters:
      - type: object
        mapping: $.
