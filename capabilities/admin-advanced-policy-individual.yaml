      description: REST surface for throttling-policies-advanced-policyId.
      operations:
      - method: GET
        name: get
        description: Get an Advanced Throttling Policy
        call: admin-advanced-policy-individual.get
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: put
        description: Update an Advanced Throttling Policy
        call: admin-advanced-policy-individual.put
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
