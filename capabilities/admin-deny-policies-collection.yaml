naftiko: 1.0.0-alpha2
info:
  label: WSO2 API Manager - Admin — Deny Policies (Collection)
  description: 'WSO2 API Manager - Admin — Deny Policies (Collection). 2 operations. Lead operation: Get all Deny Policies.
    Self-contained Naftiko capability covering one Wso2 business surface.'
  tags:
  - Wso2
  - Deny Policies (Collection)
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-deny-policies-collection
    baseUri: https://apis.wso2.com/api/am/admin/v4
    description: WSO2 API Manager - Admin — Deny Policies (Collection) business capability. Self-contained, no shared references.
    resources:
    - name: throttling-deny-policies
      path: /throttling/deny-policies
      operations:
      - name: get
        method: GET
        description: Get all Deny Policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query
          in: query
          type: string
          description: '**Search condition**.'
      - name: post
        method: POST
        description: Add a deny policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.WSO2_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-deny-policies-collection-rest
    port: 8080
    description: REST adapter for WSO2 API Manager - Admin — Deny Policies (Collection). One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/throttling/deny-policies
      name: throttling-deny-policies
      description: REST surface for throttling-deny-policies.
      operations:
      - method: GET
        name: get
        description: Get all Deny Policies
        call: admin-deny-policies-collection.get
        with:
          query: rest.query
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: post
        description: Add a deny policy
        call: admin-deny-policies-collection.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-deny-policies-collection-mcp
    port: 9090
    transport: http
    description: MCP adapter for WSO2 API Manager - Admin — Deny Policies (Collection). One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-all-deny-policies
      description: Get all Deny Policies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-deny-policies-collection.get
      with:
        query: tools.query
      outputParameters:
      - type: object
        mapping: $.
    - name: add-deny-policy
      description: Add a deny policy
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: admin-deny-policies-collection.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
