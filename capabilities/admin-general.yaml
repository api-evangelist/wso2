naftiko: 1.0.0-alpha2
info:
  label: WSO2 API Manager - Admin
  description: 'WSO2 API Manager - Admin. 5 operations. Lead operation: Retrieve UUIDs of org-theme contents. Self-contained
    Naftiko capability covering one Wso2 business surface.'
  tags:
  - Wso2
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-general
    baseUri: https://apis.wso2.com/api/am/admin/v4
    description: WSO2 API Manager - Admin business capability. Self-contained, no shared references.
    resources:
    - name: org-themes
      path: /org-themes
      operations:
      - name: getorgthemes
        method: GET
        description: Retrieve UUIDs of org-theme contents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: publish
          in: query
          type: boolean
          description: Filter themes based on published status
      - name: importorgtheme
        method: POST
        description: Import org theme
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: org-themes-id
      path: /org-themes/{id}
      operations:
      - name: deleteorgtheme
        method: DELETE
        description: Delete an org theme
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    - name: org-themes-id-content
      path: /org-themes/{id}/content
      operations:
      - name: getorgthemecontent
        method: GET
        description: Retrieve org theme as zip
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    - name: org-themes-id-status
      path: /org-themes/{id}/status
      operations:
      - name: updateorgthemestatus
        method: POST
        description: Update publish status of an org theme
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.WSO2_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-general-rest
    port: 8080
    description: REST adapter for WSO2 API Manager - Admin. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/org-themes
      name: org-themes
      description: REST surface for org-themes.
      operations:
      - method: GET
        name: getorgthemes
        description: Retrieve UUIDs of org-theme contents
        call: admin-general.getorgthemes
        with:
          publish: rest.publish
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: importorgtheme
        description: Import org theme
        call: admin-general.importorgtheme
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/org-themes/{id}
      name: org-themes-id
      description: REST surface for org-themes-id.
      operations:
      - method: DELETE
        name: deleteorgtheme
        description: Delete an org theme
        call: admin-general.deleteorgtheme
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/org-themes/{id}/content
      name: org-themes-id-content
      description: REST surface for org-themes-id-content.
      operations:
      - method: GET
        name: getorgthemecontent
        description: Retrieve org theme as zip
        call: admin-general.getorgthemecontent
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/org-themes/{id}/status
      name: org-themes-id-status
      description: REST surface for org-themes-id-status.
      operations:
      - method: POST
        name: updateorgthemestatus
        description: Update publish status of an org theme
        call: admin-general.updateorgthemestatus
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for WSO2 API Manager - Admin. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: retrieve-uuids-org-theme-contents
      description: Retrieve UUIDs of org-theme contents
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-general.getorgthemes
      with:
        publish: tools.publish
      outputParameters:
      - type: object
        mapping: $.
    - name: import-org-theme
      description: Import org theme
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: admin-general.importorgtheme
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-org-theme
      description: Delete an org theme
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: admin-general.deleteorgtheme
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-org-theme-zip
      description: Retrieve org theme as zip
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-general.getorgthemecontent
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-publish-status-org-theme
      description: Update publish status of an org theme
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: admin-general.updateorgthemestatus
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
