naftiko: 1.0.0-alpha2
info:
  label: WSO2 API Manager - DevOps
  description: 'WSO2 API Manager - DevOps. 5 operations. Lead operation: GET status of correlation log components. Self-contained
    Naftiko capability covering one Wso2 business surface.'
  tags:
  - Wso2
  - WSO2 API Manager - DevOps
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
capability:
  consumes:
  - type: http
    namespace: devops
    baseUri: https://apis.wso2.com/api/am/devops/v0
    description: WSO2 API Manager - DevOps business capability. Self-contained, no shared references.
    resources:
    - name: config-correlation
      path: /config/correlation/
      operations:
      - name: get
        method: GET
        description: GET status of correlation log components
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: put
        method: PUT
        description: Enable / Disable correlation logs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: tenant-logs-tenant-apis
      path: /tenant-logs/{tenant}/apis/
      operations:
      - name: get
        method: GET
        description: GET log level of APIs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: tenant-logs-tenant-apis-apiId
      path: /tenant-logs/{tenant}/apis/{apiId}
      operations:
      - name: get
        method: GET
        description: GET log enabled API data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: put
        method: PUT
        description: Set logging levels of the API with its api ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: devops-rest
    port: 8080
    description: REST adapter for WSO2 API Manager - DevOps. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/config/correlation
      name: config-correlation
      description: REST surface for config-correlation.
      operations:
      - method: GET
        name: get
        description: GET status of correlation log components
        call: devops.get
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: put
        description: Enable / Disable correlation logs
        call: devops.put
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tenant-logs/{tenant}/apis
      name: tenant-logs-tenant-apis
      description: REST surface for tenant-logs-tenant-apis.
      operations:
      - method: GET
        name: get
        description: GET log level of APIs
        call: devops.get
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tenant-logs/{tenant}/apis/{apiid}
      name: tenant-logs-tenant-apis-apiid
      description: REST surface for tenant-logs-tenant-apis-apiId.
      operations:
      - method: GET
        name: get
        description: GET log enabled API data
        call: devops.get
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: put
        description: Set logging levels of the API with its api ID
        call: devops.put
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: devops-mcp
    port: 9090
    transport: http
    description: MCP adapter for WSO2 API Manager - DevOps. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-status-correlation-log-components
      description: GET status of correlation log components
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: devops.get
      outputParameters:
      - type: object
        mapping: $.
    - name: enable-disable-correlation-logs
      description: Enable / Disable correlation logs
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: devops.put
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-log-level-apis
      description: GET log level of APIs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: devops.get
      outputParameters:
      - type: object
        mapping: $.
    - name: get-log-enabled-api-data
      description: GET log enabled API data
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: devops.get
      outputParameters:
      - type: object
        mapping: $.
    - name: set-logging-levels-api-its
      description: Set logging levels of the API with its api ID
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: devops.put
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
