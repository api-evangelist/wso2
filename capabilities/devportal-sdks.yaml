naftiko: 1.0.0-alpha2
info:
  label: WSO2 API Manager - Developer Portal — SDKs
  description: 'WSO2 API Manager - Developer Portal — SDKs. 2 operations. Lead operation: Generate a SDK for an API. Self-contained
    Naftiko capability covering one Wso2 business surface.'
  tags:
  - Wso2
  - SDKs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
capability:
  consumes:
  - type: http
    namespace: devportal-sdks
    baseUri: https://apis.wso2.com/api/am/devportal/v3
    description: WSO2 API Manager - Developer Portal — SDKs business capability. Self-contained, no shared references.
    resources:
    - name: apis-apiId-sdks-language
      path: /apis/{apiId}/sdks/{language}
      operations:
      - name: get
        method: GET
        description: Generate a SDK for an API
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: language
          in: path
          type: string
          description: Programming language of the SDK that is required.
          required: true
    - name: sdk-gen-languages
      path: /sdk-gen/languages
      operations:
      - name: get
        method: GET
        description: Get a List of Supported SDK Languages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.WSO2_API_KEY}}'
  exposes:
  - type: rest
    namespace: devportal-sdks-rest
    port: 8080
    description: REST adapter for WSO2 API Manager - Developer Portal — SDKs. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/apis/{apiid}/sdks/{language}
      name: apis-apiid-sdks-language
      description: REST surface for apis-apiId-sdks-language.
      operations:
      - method: GET
        name: get
        description: Generate a SDK for an API
        call: devportal-sdks.get
        with:
          language: rest.language
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sdk-gen/languages
      name: sdk-gen-languages
      description: REST surface for sdk-gen-languages.
      operations:
      - method: GET
        name: get
        description: Get a List of Supported SDK Languages
        call: devportal-sdks.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: devportal-sdks-mcp
    port: 9090
    transport: http
    description: MCP adapter for WSO2 API Manager - Developer Portal — SDKs. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: generate-sdk-api
      description: Generate a SDK for an API
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: devportal-sdks.get
      with:
        language: tools.language
      outputParameters:
      - type: object
        mapping: $.
    - name: get-list-supported-sdk-languages
      description: Get a List of Supported SDK Languages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: devportal-sdks.get
      outputParameters:
      - type: object
        mapping: $.
