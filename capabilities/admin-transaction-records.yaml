naftiko: 1.0.0-alpha2
info:
  label: WSO2 API Manager - Admin — Transaction Records
  description: 'WSO2 API Manager - Admin — Transaction Records. 1 operations. Lead operation: Get transaction count. Self-contained
    Naftiko capability covering one Wso2 business surface.'
  tags:
  - Wso2
  - Transaction Records
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WSO2_API_KEY: WSO2_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-transaction-records
    baseUri: https://apis.wso2.com/api/am/admin/v4
    description: WSO2 API Manager - Admin — Transaction Records business capability. Self-contained, no shared references.
    resources:
    - name: transaction-count
      path: /transaction-count
      operations:
      - name: get
        method: GET
        description: Get transaction count
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startTime
          in: query
          type: string
          description: Start time for the transaction count retrieval
          required: true
        - name: endTime
          in: query
          type: string
          description: End time for the transaction count retrieval
          required: true
    authentication:
      type: bearer
      token: '{{env.WSO2_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-transaction-records-rest
    port: 8080
    description: REST adapter for WSO2 API Manager - Admin — Transaction Records. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/transaction-count
      name: transaction-count
      description: REST surface for transaction-count.
      operations:
      - method: GET
        name: get
        description: Get transaction count
        call: admin-transaction-records.get
        with:
          startTime: rest.startTime
          endTime: rest.endTime
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-transaction-records-mcp
    port: 9090
    transport: http
    description: MCP adapter for WSO2 API Manager - Admin — Transaction Records. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-transaction-count
      description: Get transaction count
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-transaction-records.get
      with:
        startTime: tools.startTime
        endTime: tools.endTime
      outputParameters:
      - type: object
        mapping: $.
